    <!-- Theme applied before first paint, mirrored by ThemeProvider -->
    <script>
      {
        const stored = localStorage.getItem("theme-class");
        const hasStoredTheme = stored === "dark" || stored === "light";
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(hasStoredTheme ? stored : systemTheme);
      }
    </script>
